name: Publish signed Android player
on:
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: Branch containing the already signed APK and its checksum
        required: true
        default: release-artifacts/v0.4.0
      release_tag:
        description: Existing draft release tag
        required: true
        default: v0.4.0
      sha256:
        description: Expected SHA256 of the signed APK
        required: true
        default: 7e2198dc3a391cc16c81e072039d98a4bf09aa08698a5be1dc57dbac77423209
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_ref }}
          persist-credentials: false
      - name: Verify exact signed installer bytes
        env:
          PLAYER_EXPECTED_SHA: ${{ inputs.sha256 }}
          PLAYER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$PLAYER_EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLAYER_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha256sum -c LARP-Player.apk.sha256
          echo "$PLAYER_EXPECTED_SHA  LARP-Player.apk" | sha256sum -c -
      - name: Upload installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAYER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$PLAYER_RELEASE_TAG" LARP-Player.apk LARP-Player.apk.sha256
