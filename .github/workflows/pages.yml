name: Publish site and games
# Сайт (страница скачивания приложения, веб-игрок для iPhone) и опубликованные игры.
# Игры мастерская кладёт в ветку `games` и запускает сборку событием repository_dispatch.
on:
  push:
    branches: [main]
  # Мастерская после публикации отправляет событие publish (нужен только доступ Contents).
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Add published games
        run: |
          if git ls-remote --exit-code --heads origin games >/dev/null; then
            git fetch --depth 1 origin games
            mkdir -p web/dist/games
            git --work-tree=web/dist/games checkout FETCH_HEAD -- .
            echo "Опубликованные игры:"; cat web/dist/games/catalog.json || true
          else
            echo "Игры ещё не публиковались."
          fi
      - name: Check size limits
        run: |
          du -sh web/dist
          find web/dist -type f -size +95M -print -exec false {} +
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
