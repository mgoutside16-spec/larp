name: Publish browser workshop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser test tools in CI
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify browser workflow and preservation across application update
        env:
          LARP_WEB_ARTIFACTS: ${{ runner.temp }}/larp-browser-tests
        run: |
          python -m http.server 5173 --bind 127.0.0.1 --directory dist > /tmp/larp-web-server.log 2>&1 &
          python tests/browser_check.py
          python tests/regression_check.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: ${{ runner.temp }}/larp-browser-tests/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
