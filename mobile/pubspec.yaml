name: larp_player
description: Автономное приложение игрока «Без правил».
publish_to: none
version: 0.5.1+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  archive: 4.5.2
  crypto: ^3.0.6
  path: ^1.9.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  video_player: ^2.10.1
  just_audio: ^0.10.5
  flutter_widget_from_html_core: ^0.17.0
  html: ^0.15.6
  image: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/
