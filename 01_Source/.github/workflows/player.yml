name: Android player checks
on:
  push:
    paths:
      - 'mobile/**'
      - 'scripts/**'
      - '.github/workflows/player.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DASH__SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Compile Android native plugins
        run: flutter build apk --debug --target-platform android-arm64
      # Consumer release APKs use the private stable signing key through
      # scripts/build-player-apk.sh. Never publish CI debug keys as releases.
